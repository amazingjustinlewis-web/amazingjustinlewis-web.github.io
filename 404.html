</style>
<script>
  // Work out the site root (see comment above), then upgrade the page.
  (function () {
    var host = location.hostname, seg = location.pathname.split('/')[1] || '';
    function apply(root) {
      var css = document.createElement('link'); css.rel = 'stylesheet'; css.href = root + 'assets/css/style.css';
      document.head.appendChild(css);
      var go = function () {
        document.querySelectorAll('[data-href]').forEach(function (a) { a.href = root + a.getAttribute('data-href'); });
        var s = document.createElement('script'); s.src = root + 'assets/js/site-config.js';
        s.onload = function () {
          if (!window.SITE) return;
          document.querySelectorAll('[data-site-name]').forEach(function (el) { el.textContent = window.SITE.name; });
          document.title = '404 - Game Over | ' + window.SITE.name;
        };
        document.body.appendChild(s);
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
    }
    // Only a *.github.io project site can live under a sub-folder; probe it once.
    if (/\.github\.io$/i.test(host) && seg && seg.indexOf('.') === -1 && window.fetch) {
      fetch('/' + seg + '/assets/js/site-config.js', { method: 'HEAD' })
        .then(function (r) { apply(r.ok ? '/' + seg + '/' : '/'); })
        .catch(function () { apply('/'); });
    } else {
      apply('/');
    }
  })();
</script>
