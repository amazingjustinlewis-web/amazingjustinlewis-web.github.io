<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#000000"><title>Zero to Phi - Playtest</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#eee;font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:28px 18px 60px}h1{font-size:15px;letter-spacing:.32em;text-transform:uppercase;font-weight:600;margin:0 0 4px;color:#fff}
.sub{opacity:.55;font-size:13px;margin:0 0 26px}.ask{font-size:22px;font-weight:600;margin:18vh 0 18px;text-align:center}
.two{display:grid;gap:12px}.two button{padding:26px 16px;font:600 20px system-ui;border-radius:14px;border:1px solid #fff2;background:#111;color:#fff;cursor:pointer}
.two button small{display:block;font-weight:400;font-size:13px;opacity:.55;margin-top:4px}.two button:active{background:#222}
.card{border:1px solid #fff1;background:#0b0b0b;border-radius:14px;padding:16px;margin:0 0 14px}.card h2{margin:0;font-size:20px}.ver{font:600 12px ui-monospace,monospace;color:#ffb300;margin-left:8px;vertical-align:middle}
.meta{font-size:13px;opacity:.55;margin:2px 0 10px}.card ul{margin:0 0 14px;padding-left:18px;font-size:14px;opacity:.85}.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.45;margin-bottom:4px}
.row{display:flex;gap:8px}.row a{flex:1;text-align:center;padding:12px;border-radius:10px;text-decoration:none;font-weight:600}.play{background:#ffb300;color:#000}.fb{background:#1c1c1c;color:#fff;border:1px solid #fff2}
.foot{margin-top:24px;display:flex;justify-content:space-between;align-items:center;font-size:13px}.foot a{color:#fff;opacity:.7}#mode{background:none;border:0;color:#fff;opacity:.6;text-decoration:underline;font:13px system-ui;cursor:pointer;padding:0}
</style></head><body><main>
<h1>Zero to Phi</h1><p class="sub">Playtest - always the current build. Thanks for testing.</p>
<div id="pick"><div class="ask">Which is this device?</div><div class="two">
<button data-m="tv">Viewing screen<small>TV, laptop or tablet everyone watches</small></button>
<button data-m="phone">Phone controller<small>the phone in your hand</small></button></div></div>
<div id="list" hidden></div>
<div class="foot" id="foot" hidden><button id="mode"></button><a id="fbAll" href="#">Feedback</a></div>
</main>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); }, CFG = null, mode = localStorage.getItem('ztp-pt-mode');
  function dev() { var u = navigator.userAgent, os = /iPhone|iPad/.test(u) ? 'iOS' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : /Linux/.test(u) ? 'Linux' : 'other';
    var br = /Edg\//.test(u) ? 'Edge' : /CriOS|Chrome\//.test(u) ? 'Chrome' : /FxiOS|Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : 'browser';
    return os + ' / ' + br + ' / ' + screen.width + 'x' + screen.height + ' / ' + (mode === 'tv' ? 'viewing screen' : 'phone controller'); }
  function mail(game, ver) {
    var s = '[Playtest] ' + (game ? game + ' ' + ver : 'general'), b = (game ? 'Game: ' + game + '\nBuild: ' + ver + '\n' : '') + 'Device: ' + dev() + '\n\nYour notes (type or voice-to-text):\n\n';
    return 'mailto:' + CFG.feedback_email + '?subject=' + encodeURIComponent(s) + '&body=' + encodeURIComponent(b); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function render() {
    $('pick').hidden = true; $('list').hidden = false; $('foot').hidden = false; $('mode').textContent = (mode === 'tv' ? 'Viewing screen' : 'Phone controller') + ' - change';
    $('fbAll').href = mail(null);
    $('list').innerHTML = CFG.games.map(function (g, i) { return '<div class="card"><h2>' + esc(g.name) + '<span class="ver" id="v' + i + '">' + esc(g.build || '...') + '</span></h2><div class="meta">' + esc(g.players || '') + '</div>' +
      (g.new && g.new.length ? '<div class="lab">New in this build</div><ul>' + g.new.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' : '') +
      '<div class="row"><a class="play" href="' + esc(mode === 'tv' ? g.tv : g.phone) + '">' + (mode === 'tv' ? 'Open on this screen' : 'Play / join') + '</a><a class="fb" id="f' + i + '" href="#">Feedback</a></div></div>'; }).join('') || '<p>No games open right now.</p>';
    CFG.games.forEach(function (g, i) {
      function set(v, d) { g.build = v; $('v' + i).textContent = v + (d ? ' \u00b7 ' + d : ''); $('f' + i).href = mail(g.name, v); }
      set(g.build || '?');
      if (g.build_source) fetch(g.build_source + '?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (b) { set(b.ver, b.date); }).catch(function () {});
    });
  }
  function choose(m) { mode = m; localStorage.setItem('ztp-pt-mode', m); if (CFG) render(); }
  document.querySelectorAll('.two button').forEach(function (b) { b.onclick = function () { choose(b.dataset.m); }; });
  $('mode').onclick = function () { $('list').hidden = true; $('foot').hidden = true; $('pick').hidden = false; };
  fetch('playtest.json?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (c) { CFG = c; if (mode) render(); });
  window.PT = { get cfg() { return CFG; }, mail: mail };
})();
</script></body></html>
