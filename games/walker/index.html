<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Walker | Zero to Phi</title>
<meta name="description" content="Walker: a calm, soft 3D play world. Big picture buttons, a bouncy castle, a playground and a quiet path. Prototype v0.3 by Zero to Phi: roller coaster, petting zoo, water park and bumper boats.">
<meta name="theme-color" content="#cfe8ff"><meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="js/pad.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8ff;font-family:Fredoka,system-ui,sans-serif;color:#5a4636}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:5vw;background:linear-gradient(#cfe8ffcc,#fdf3e1ee);transition:opacity 1.2s;z-index:10}
#start.gone{opacity:0;pointer-events:none}
.card{background:#fffaf0;border-radius:32px;padding:3vh 3vw;box-shadow:0 10px 40px #0002;text-align:center}
h1{font-size:9vh;margin:0;color:#ff8fc7;letter-spacing:.04em}
.pres{font-size:2.2vh;color:#9a8a78;letter-spacing:.2em}
#qr{width:40vh;height:40vh;margin:2vh auto 1vh;background:#fff;border-radius:16px;padding:6px}
#qr svg{width:100%;height:100%}
#code{font-size:4vh;letter-spacing:.3em;font-weight:600}
#here{font:inherit;font-size:5vh;padding:2.5vh 5vw;border-radius:30px;border:0;background:#7ed957;color:#fff;box-shadow:inset 0 -8px 0 #0002,0 6px 20px #0002;cursor:pointer}
#here.suggest{animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.hint{font-size:2.4vh;color:#9a8a78;margin-top:1.5vh}
.back{position:absolute;left:2vw;top:2vh;color:#9a8a78;font-size:2vh;text-decoration:none}
#lpad{position:fixed;left:0;right:0;bottom:0;height:24vh;display:none;z-index:5}
body.local #lpad{display:flex}
#corner{position:fixed;right:1.5vw;bottom:1.5vh;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.92;z-index:4;transition:opacity 1s}
#mini{width:24vh;height:24vh;background:#fff;border-radius:14px;padding:8px;box-shadow:0 4px 18px #0003;transition:width 1.5s,height 1.5s}#mini svg{width:100%;height:100%}
#minicode{font-size:3vh;letter-spacing:.25em;background:#fffaf0dd;border-radius:10px;padding:2px 10px;font-weight:600}
body.linked #mini{width:14vh;height:14vh}body.linked #corner{opacity:.7}body.linked #minicode{font-size:2vh}
#port{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity 2.5s}
#port.on{opacity:1}
#port .rim{position:absolute;inset:0;border-radius:13vh;box-shadow:0 0 0 1vh #d4dae3,0 0 0 3.6vh #a7afbd,0 0 0 4.4vh #5d6472,0 0 0 60vh #535a68,inset 0 0 6vh #00000066;margin:4.5vh}
#port .bolt{position:absolute;width:1.5vh;height:1.5vh;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8ecf2,#7d8596 70%);box-shadow:0 1px 2px #0006;transform:translate(-50%,-50%)}
#splashfx{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(ellipse at center,#bfe8ff55,#5fb8e8cc)}
#splashfx.go{animation:spl 1.2s ease-out}#splashfx.big{animation:spl 2.2s ease-out}
@keyframes spl{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
body.local #corner{display:none}
</style></head><body>
<canvas id="gl" aria-label="A calm park seen through the eyes of a kid"></canvas>
<div id="port"><div class="rim"></div></div><div id="splashfx"></div>
<div id="corner"><div id="mini"></div><div id="minicode"></div></div>
<div id="lpad"></div>
<div id="start">
  <a class="back" href="../../family.html">&larr; games</a>
  <div class="card"><div class="pres">ZERO TO PHI <span id="ver"></span></div><h1>Walker</h1><div id="qr"></div><div id="code">....</div><div class="hint">&#x1F4F1; scan to play with a phone<br>(the code stays in the corner too)</div></div>
  <div class="card"><div style="font-size:12vh">&#x1F3F0;&#x1F6DD;</div><button id="here">&#x25B6; Play here</button><div class="hint">big buttons right on this screen</div></div>
</div>
<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/peerjs.min.js"></script>
<script>if (typeof Peer !== 'function') document.write('<script src="js/vendor/peerjs.legacy.min.js"><\/script>');</script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/config.js"></script>
<script src="js/net.js"></script>
<script src="js/sfx.js"></script>
<script src="js/ui.js"></script>
<script src="js/world2.js"></script>
<script src="js/world.js"></script>
<script>(function(){var p=document.getElementById('port');function b(x,y){var e=document.createElement('div');e.className='bolt';e.style.left=x;e.style.top=y;p.appendChild(e);}var n=7;for(var i=1;i<n;i++){b((i/n*100)+'%','1.6vh');b((i/n*100)+'%','calc(100% - 1.6vh)');}for(i=1;i<4;i++){b('1.6vh',(i/4*100)+'%');b('calc(100% - 1.6vh)',(i/4*100)+'%');}})();</script>
<script src="js/tv.js"></script>
</body></html>
