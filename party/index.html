<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Family Arcade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#14102a;color:#fff;font-family:system-ui,"Segoe UI",sans-serif;overflow:hidden}
body{background:radial-gradient(circle at 20% 0,#3b2a7a,transparent 60%),radial-gradient(circle at 90% 100%,#7a2a55,transparent 55%),#14102a}
#home{height:100%;display:flex;flex-direction:column;padding:1.6vh 2vw}
header{text-align:center;margin-bottom:1.4vh}
h1{margin:0;font-size:6vh;letter-spacing:.04em;background:linear-gradient(90deg,#ffd35a,#ff8fc7,#8fe6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:.4vh 0 0;font-size:2.6vh;color:#e9e3ff}
#grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:1.6vh 1.4vw;min-height:0}
.card{position:relative;display:flex;flex-direction:column;background:#231c45;border:.5vh solid transparent;border-radius:2vh;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;min-height:0}
.card.feat{grid-row:span 2}
.card img{width:100%;flex:1;min-height:0;object-fit:cover;background:#0c0a1a}
.card .t{padding:1vh 1vw 1.2vh}
.card h2{margin:0;font-size:3vh}.card.feat h2{font-size:4.4vh}
.card .how{margin:.4vh 0 0;font-size:1.9vh;color:#d8d0f5;line-height:1.25}.card.feat .how{font-size:2.5vh}
.pills{margin-top:.6vh;display:flex;gap:.5vw;flex-wrap:wrap}
.pill{font-size:1.7vh;font-weight:700;padding:.3vh .7vw;border-radius:99px;background:#ffd35a;color:#1a1430}.pill.k{background:#8fe6ff}
.badge{position:absolute;top:1vh;left:1vh;background:#ff8fc7;color:#1a1430;font-weight:800;font-size:2vh;padding:.4vh .8vw;border-radius:99px}
.card.sel{border-color:#ffd35a;transform:scale(1.03);box-shadow:0 0 3vh #ffd35a88;z-index:2}
#hint{text-align:center;font-size:1.7vh;color:#9c93c4;margin-top:1vh}
#play{position:fixed;inset:0;display:none;background:#000}
#play iframe{width:100%;height:100%;border:0;display:block}
#back{position:fixed;top:8px;right:8px;z-index:10;display:none;background:#0009;color:#fff;border:1px solid #fff5;border-radius:99px;padding:6px 12px;font:600 13px system-ui;cursor:pointer;opacity:.45}
#back:hover{opacity:1}
#stats{position:fixed;inset:5vh 8vw;background:#0d0b1c;border:2px solid #ffd35a;border-radius:16px;padding:20px;display:none;z-index:20;overflow:auto;font-size:18px}
#stats table{border-collapse:collapse;width:100%;margin:10px 0}#stats td,#stats th{border-bottom:1px solid #333;padding:6px 10px;text-align:left}
#stats button{font-size:16px;padding:8px 14px;margin-right:8px;border-radius:8px;border:0;cursor:pointer}
</style></head><body>
<div id="home">
  <header><h1>Family Arcade</h1><p>Grab your phone, no app needed: pick a game, scan the code on screen, and you're in.</p></header>
  <div id="grid"></div>
  <div id="hint">Click a game, or use the arrow keys and Enter</div>
</div>
<div id="play"></div>
<button id="back" title="Back to arcade (Esc)">&larr; Back to arcade (Esc)</button>
<div id="stats"></div>
<script>
(function(){
var GAMES=[
 {id:'rdr',name:'Red Deer Rich',ver:'v0.6',url:'../games/red-deer-rich/index.html',img:'../assets/img/red-deer-rich/cover-card.webp',how:'Buy, trade and build your way across Red Deer. Deals happen on your phone.',players:'2\u20138 players',feat:1},
 {id:'zt',name:'Zombie Tiles',ver:'v0.5',url:'../games/zombie-tiles/index.html',img:'../assets/img/zombie-tiles/cover-card.webp',how:'Loot the town, dodge zombies, reach the helipad.',players:'1\u20134 players'},
 {id:'walker',name:'Walker',ver:'v0.4',url:'../games/walker/index.html',img:'../assets/img/walker/cover-card.webp',how:'A calm 3D play world. Tap the big pictures to explore.',players:'1 player'},
 {id:'laser',name:'Laser Range',ver:'v0.1',url:'../games/laser-range/index.html',img:'../assets/img/laser-range/cover-card.webp',how:'Point your phone at the TV like a light gun. Don\u2019t shoot granny!',players:'1\u20134 players'},
 {id:'hop',name:'Charge Hop',ver:'v0.3',url:'../games/charge-hop/index.html',img:'../assets/img/charge-hop/cover-card.webp',how:'One button: hold to charge, let go to hop. Don\u2019t overcharge!',players:'1\u20132 players',kb:1,escTwice:1},
 {id:'cafe',name:'Caf\u00e9 Games',ver:'v0.1',url:'../cafe/screen.html?demo=1',img:'../cafe/shots/06-screen-c4-midgame.png',how:'Connect Four and Battleship, head to head on your phones.',players:'2 players'},
 {id:'space',name:'Drift Signal',ver:'v0.3',url:'../games/space/index.html',img:'../assets/img/space/cover-card.webp',how:'The TV is your ship\u2019s window. Every phone is a crew station.',players:'1\u20136 crew'}
];
var LK='party log',CK='party log current',sel=0,cur=null,frame=null,escAt=0;
function load(){try{return JSON.parse(localStorage.getItem(LK))||[]}catch(e){return[]}}
function save(a){try{localStorage.setItem(LK,JSON.stringify(a))}catch(e){}}
function add(r){var a=load();a.push(r);save(a)}
function now(){return new Date().toISOString()}
// finish a session left open by a refresh / crash
function closeOpen(how){var c;try{c=JSON.parse(localStorage.getItem(CK))}catch(e){}
 if(c){var end=c.last||Date.now();add({type:'play',game:c.game,name:c.name,start:new Date(c.t).toISOString(),end:new Date(end).toISOString(),secs:Math.round((end-c.t)/1000),ended:how});localStorage.removeItem(CK)}}
closeOpen('refresh');
add({type:'arcade-open',time:now()});
setInterval(function(){if(cur){try{var c=JSON.parse(localStorage.getItem(CK));if(c){c.last=Date.now();localStorage.setItem(CK,JSON.stringify(c))}}catch(e){}}},5000);
window.addEventListener('pagehide',function(){if(cur){try{var c=JSON.parse(localStorage.getItem(CK));c.last=Date.now();localStorage.setItem(CK,JSON.stringify(c))}catch(e){}closeOpen('refresh')}});

var grid=document.getElementById('grid');
GAMES.forEach(function(g,i){var d=document.createElement('div');d.className='card'+(g.feat?' feat':'');
 d.innerHTML=(g.feat?'<span class="badge">\u2605 Featured</span>':'')+'<img alt="" src="'+g.img+'"><div class="t"><h2>'+g.name+'</h2><p class="how">'+g.how+'</p><div class="pills"><span class="pill">'+g.players+'</span>'+(g.kb?'<span class="pill k">\u2328 Laptop keyboard</span>':'<span class="pill k">\ud83d\udcf1 Phones</span>')+'</div></div>';
 d.onclick=function(){sel=i;paint();launch(i)};d.onmouseenter=function(){sel=i;paint()};grid.appendChild(d)});
var cards=grid.children;function paint(){for(var i=0;i<cards.length;i++)cards[i].classList.toggle('sel',i===sel)}paint();

function launch(i){if(cur)return;var g=GAMES[i];cur=g;
 localStorage.setItem(CK,JSON.stringify({game:g.id,name:g.name+' '+g.ver,t:Date.now(),last:Date.now()}));
 frame=document.createElement('iframe');frame.allow='autoplay; fullscreen; gyroscope; accelerometer';frame.src=g.url;
 document.getElementById('play').appendChild(frame);document.getElementById('play').style.display='block';
 document.getElementById('home').style.display='none';document.getElementById('back').style.display='block';
 frame.addEventListener('load',function(){try{var w=frame.contentWindow;w.addEventListener('keydown',onKey,true)}catch(e){}});
 try{document.documentElement.requestFullscreen&&!document.fullscreenElement&&document.documentElement.requestFullscreen().catch(function(){})}catch(e){}
 setTimeout(function(){try{frame.focus()}catch(e){}},300)}
function back(){if(!cur)return;closeOpen('back');cur=null;
 if(frame){frame.src='about:blank';frame.remove();frame=null}
 document.getElementById('play').style.display='none';document.getElementById('home').style.display='flex';document.getElementById('back').style.display='none';window.focus()}
document.getElementById('back').onclick=back;

function onKey(e){
 if(cur){if(e.key==='Escape'){if(cur.escTwice){var t=Date.now();if(t-escAt<700){e.preventDefault();back()}escAt=t}else{e.preventDefault();e.stopPropagation();back()}}return}
 if(document.getElementById('stats').style.display==='block'){if(e.key==='Escape'||e.key==='l'||e.key==='L')hideStats();return}
 var cols=4,k=e.key;
 if(k==='ArrowRight')sel=(sel+1)%GAMES.length;else if(k==='ArrowLeft')sel=(sel+GAMES.length-1)%GAMES.length;
 else if(k==='ArrowDown')sel=sel===0?1:Math.min(GAMES.length-1,sel+3);else if(k==='ArrowUp')sel=sel<=3?sel:sel-3;
 else if(k==='Enter'||k===' '){e.preventDefault();launch(sel);return}else if(k==='l'||k==='L'){showStats();return}else return;
 e.preventDefault();paint()}
document.addEventListener('keydown',onKey,true);

function fmt(s){s=Math.round(s);var m=Math.floor(s/60),h=Math.floor(m/60);return h?h+'h '+(m%60)+'m':m?m+'m '+(s%60)+'s':s+'s'}
function summary(){var a=load().filter(function(r){return r.type==='play'}),by={};
 a.forEach(function(r){var b=by[r.name]||(by[r.name]={n:0,tot:0,max:0});b.n++;b.tot+=r.secs;b.max=Math.max(b.max,r.secs)});return{plays:a,by:by}}
function showStats(){var s=summary(),h='<h2 style="margin:0">Party log</h2><table><tr><th>Game</th><th>Plays</th><th>Total time</th><th>Average</th><th>Longest</th></tr>';
 Object.keys(s.by).sort(function(x,y){return s.by[y].tot-s.by[x].tot}).forEach(function(k){var b=s.by[k];h+='<tr><td>'+k+'</td><td>'+b.n+'</td><td>'+fmt(b.tot)+'</td><td>'+fmt(b.tot/b.n)+'</td><td>'+fmt(b.max)+'</td></tr>'});
 if(!s.plays.length)h+='<tr><td colspan=5>No plays yet</td></tr>';
 h+='</table><button id="dl" style="background:#ffd35a">Download log (.txt)</button><button id="clr" style="background:#ff8fc7">Clear log</button><button id="cls">Close (L)</button>';
 var p=document.getElementById('stats');p.innerHTML=h;p.style.display='block';
 document.getElementById('dl').onclick=download;document.getElementById('cls').onclick=hideStats;
 document.getElementById('clr').onclick=function(){if(confirm('Clear the whole party log? This cannot be undone.')){save([]);showStats()}}}
function hideStats(){document.getElementById('stats').style.display='none'}
function lt(iso){return new Date(iso).toLocaleString()}
function download(){var s=summary(),t='FAMILY ARCADE PARTY LOG\nSaved: '+new Date().toLocaleString()+'\n\nSUMMARY\n';
 Object.keys(s.by).forEach(function(k){var b=s.by[k];t+=k+': '+b.n+(b.n===1?' play':' plays')+', total '+fmt(b.tot)+', average '+fmt(b.tot/b.n)+', longest '+fmt(b.max)+'\n'});
 t+='\nEVERY SESSION\n';s.plays.forEach(function(r,i){t+=(i+1)+'. '+r.name+' | '+lt(r.start)+' -> '+lt(r.end)+' | '+fmt(r.secs)+' | ended by '+r.ended+'\n'});
 t+='\nARCADE PAGE OPENED\n';load().filter(function(r){return r.type==='arcade-open'}).forEach(function(r){t+=lt(r.time)+'\n'});
 var b=new Blob([t],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='party-log-'+new Date().toISOString().slice(0,10)+'.txt';document.body.appendChild(a);a.click();a.remove()}
window.PARTY={launch:launch,back:back,summary:summary};
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script></body></html>
