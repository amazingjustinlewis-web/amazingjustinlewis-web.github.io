<script>/* phones see the zero page with a breathing gold glow instead of the QR (tap = hub); ?from=qr jumps to the hub; ?tv=1 forces the TV page */
(function(){var q=new URLSearchParams(location.search);if(q.get('tv')==='1')return;

<svg id="s" xmlns="http://www.w3.org/2000/svg" aria-label="Zero to Phi" shape-rendering="geometricPrecision">
 <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="-19.07" y1="-36.69" x2="78.98" y2="42.98"><stop offset="0" stop-color="#FBE7A1"/><stop offset=".5" stop-color="#E2B84A"/><stop offset="1" stop-color="#C08A22"/></linearGradient></defs>

<script>
(function(){
var qs=new URLSearchParams(location.search),still=matchMedia('(prefers-reduced-motion: reduce)').matches||qs.get('still')==='1',PULSE=qs.get('pulse')!=='0';
var FIXT=qs.has('t')?+qs.get('t'):null,THIN=qs.has('thin')?+qs.get('thin'):0.8; // erode radius in logo units
var svg=document.getElementById('s'),logo=document.getElementById('logo'),ql=document.getElementById('ql');
var VB={x:-19.07,y:-36.69,w:98.05,h:79.67},CX=0.06,CY=0.1,PX=49.7,PY=0.1;
var Q,N,QZ=4,ready=false;function setQR(u){Q=qrcode(0,'H');Q.addData(u);Q.make();N=Q.getModuleCount();window.__qrURL=u;if(ready)fit()}
setQR('https://amazingjustinlewis-web.github.io/go/');
function fit(){var W=innerWidth,H=innerHeight,k=Math.min(W*0.9/VB.w,H*0.78/VB.h),vw=W/k,vh=H/k,mx=VB.x+VB.w/2,my=VB.y+VB.h/2;
 svg.setAttribute('viewBox',(mx-vw/2)+' '+(my-vh/2)+' '+vw+' '+vh);
 window.__zc=((CX-(mx-vw/2))*k).toFixed(1)+'px '+((CY-(my-vh/2))*k).toFixed(1)+'px';window.__pc=((PX-(mx-vw/2))*k).toFixed(1)+'px '+((PY-(my-vh/2))*k).toFixed(1)+'px';
 var dpr=devicePixelRatio||1,n=N+2*QZ,mpx=Math.max(2,Math.floor(21*k*dpr/n))/dpr,u=mpx/k,S=u*n;
 // snap the QR's corner to the device-pixel grid
 var sx=(CX-S/2-(mx-vw/2))*k*dpr,sy=(CY-S/2-(my-vh/2))*k*dpr,ox=(mx-vw/2)+Math.round(sx)/(k*dpr),oy=(my-vh/2)+Math.round(sy)/(k*dpr);
 ql.setAttribute('x',ox);ql.setAttribute('y',oy);ql.setAttribute('width',S);ql.setAttribute('height',S);
 var d='';for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(Q.isDark(r,c))d+='M'+(ox+(c+QZ)*u)+' '+(oy+(r+QZ)*u)+'h'+u+'v'+u+'h-'+u+'z';
 document.getElementById('qd').setAttribute('d',d);QC=[ox+S/2,oy+S/2]}
var QC=[0,0],qg=document.getElementById('qr');
// envelope (8 s): the dome 1.02*sin(pi*t/8)^0.35, windowed by a smootherstep so ~25% of each cycle rests in black with soft edges
function qrLevel(T){if(still||!PULSE)return 1;var u=T%8,dd=Math.min(u,8-u),t=Math.max(0,Math.min(1,(dd-0.9)/0.5)),w=t*t*t*(t*(6*t-15)+10);
 return 1.02*Math.pow(Math.sin(Math.PI*u/8),0.35)*w}
function col(k){return 'rgb('+[206,160,62].map(function(v){return Math.max(0,Math.min(255,Math.round(v*k)))}).join(',')+')'}
// size follows the same envelope: 90% at the bottom of the dip, exactly 100% (pixel-snapped) at the peak
var disc=document.getElementById('disc');if(window.ZTP_PHONE){disc.style.display='';document.getElementById('qr').style.display='none';disc.setAttribute('cx',CX);disc.setAttribute('cy',CY)}
var ZQ=ZeroQR({still:still||!PULSE});
function tick(ms){var T=FIXT!=null?FIXT:ms/1000,R=ZQ.frame(T),L=R.level,sc=R.scale;ql.setAttribute('fill',col(L));
 if(window.ZTP_PHONE){disc.setAttribute('opacity',Math.min(1,L).toFixed(3));disc.setAttribute('r',(9*(0.75+0.25*Math.min(1,L))).toFixed(3))}
 qg.setAttribute('transform',sc>=0.9995?'':'translate('+QC[0]+' '+QC[1]+') scale('+sc.toFixed(4)+') translate('+(-QC[0])+' '+(-QC[1])+')');if(!still)requestAnimationFrame(tick)}
fetch('assets/img/logo.svg').then(function(r){return r.text()}).then(function(t){
 var doc=new DOMParser().parseFromString(t,'image/svg+xml');[].forEach.call(doc.querySelectorAll('path'),function(p){var q=document.createElementNS('http://www.w3.org/2000/svg','path');q.setAttribute('d',p.getAttribute('d'));logo.appendChild(q)});
 document.getElementById('er').setAttribute('radius',THIN);ready=true;fit();addEventListener('resize',fit);tick(0);document.documentElement.dataset.ready=1;requestAnimationFrame(tick)});
// a click, tap or Enter anywhere opens the hub (TV remotes and laptops)
// front door: a per-screen pairing room; phone remote or a local click opens the options menu
// [id, name, typical minutes, late join?]  big-screen games fly onto the TV; phone-only games release the screen
var GAMES=[['red-deer-rich','Red Deer Rich',60,0],['zombie-tiles','Zombie Tiles',20,0],['space','Drift Signal',30,1],['mech','Iron Stride',15,1],['laser-range','Laser Range',10,1],['walker','Walker',20,1]];
var PHONE_GAMES=[['Battleship','cafe/play.html']];
function gameItem(g){return{id:g[0],label:g[1]+'  · TV',play:'games/'+g[0]+'/index.html',name:g[1],mins:g[2],late:g[3],ctrl:g[3]?'../games/'+g[0]+'/controller.html':'',p1ctrl:'../games/'+g[0]+'/controller.html',spin:g[0]==='space'||g[0]==='mech'}}
var door=window.ZTP_PHONE?null:Door({name:'Zero to Phi',title:'ZERO TO PHI',
 find:function(id){var g=GAMES.filter(function(x){return x[0]===id})[0];return g&&gameItem(g)},
 items:function(){return[{label:'Games',sub:function(){return GAMES.map(gameItem).concat(PHONE_GAMES.map(function(p){return{label:p[0]+'  · phone',phoneGo:'../'+p[1],href:p[1]}}),[{label:'Back',back:1}])}},
  {label:'Explore 0-Phi',phoneGo:'../classic.html',href:'classic.html'},
  {label:'Set up a café screen',phone:'#biz'},{label:'Close',close:1}]},
 onCode:function(u){setQR(u)},flyEl:function(){return svg},flyOrigin:function(){return window.__zc||'50% 50%'},spinOrigin:function(){return window.__pc||null},onPaired:function(p){ZQ.setForced(p?true:null,3.5)}});
addEventListener('click',function(e){if(window.ZTP_PHONE){location.href='go/';return}if(door&&!door.isOpen()&&!e.target.closest('#door,#doorframe'))door.menu()});
})();
</script>
