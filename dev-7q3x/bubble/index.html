<script>/* v0.9.45 leaderboard: at the final whistle (real games only) the TV broadcasts the result; each phone on the winning team posts the goal margin
   under its own account + chosen name and replies acctok. After 5 s the TV posts for any winning phone that could not (guest/offline fallback), then shows the top 10. */
Acct.watch(function () { return window.BHT && !BHT.demo && BHT.sim.over >= 0; }, function () {
  var sim = BHT.sim, w = sim.over, sc = sim.sc.slice(), hs = BHT.plist.filter(function (p) { return p.tm === w; }), meta = { title: 'Bubble Hockey: Top 10 wins', meaning: 'Score = winning goal margin' };
  BHT.plist.forEach(function (p) { p.acctok = null; p.acctwait = 0; });
  try { BHT.host.all({ t: 'bhfinal', w: w, sc: sc }); } catch (e) {}
  var fb = [];
  window.BHBoard = function () { meta.mine = hs.filter(function (p) { return p.acctok && p.acctok.ok; }).map(function (p) { return p.acctok.e; }).concat(fb); Acct.board('bubble', meta); };
  BHBoard(); if (!hs.length) return;
  // phones that said they're entering initials get 32 s; silent ones (old/offline phones) get 5 s; then the TV posts for them (guest fallback)
  function fallback(list) { list = list.filter(function (p) { return !(p.acctok && p.acctok.ok) && !p.fbDone; }); if (!list.length) return; list.forEach(function (p) { p.fbDone = 1; });
    var nm = list.map(function (p) { return String(p.name || '').replace(/</g, ''); }).filter(Boolean).join(' + ');
    Acct.submit('bubble', { name: nm || '???', score: sc[w] - sc[1 - w], label: sc[w] + '\u2013' + sc[1 - w] }).then(function (e) { fb.push(e); BHBoard(); }); }
  hs.forEach(function (p) { p.fbDone = 0; });
  setTimeout(function () { fallback(hs.filter(function (p) { return !p.acctwait; })); }, 5000);
  setTimeout(function () { fallback(hs); }, 32000);
});
Acct.watch(function () { return window.BHT && BHT.sim.over < 0; }, Acct.hide);</script>
