<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>Bubble Hockey</title><link rel="stylesheet" href="../minikit/kit.css">
<style>body{background:#0c1226}#score{position:fixed;left:0;right:0;top:6px;text-align:center;z-index:5;font-size:20px;font-weight:700}#score span.t{font-weight:400;opacity:.7;font-size:15px;margin:0 10px}
#hostq{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:210px;background:#000c;border-radius:16px;padding:12px;text-align:center;z-index:7;display:none}#hostq .kcode{font-size:24px}#kjoin .btn{width:100%;margin-top:8px}
#tip{position:fixed;left:0;right:0;bottom:8px;text-align:center;font-size:12px;opacity:.6;z-index:4;pointer-events:none}</style></head><body>
<canvas id="cv" class="full"></canvas><div id="score"></div><div class="big" id="big" style="opacity:0"></div><div id="tip">drag a player along his slot \u00b7 your finger turns his stick \u00b7 flick toward a teammate to pass \u00b7 tap to shoot</div>
<div id="hostq"><div id="hq"></div><p style="margin:6px 0 0;font-size:14px">Friend scans to join.<br>The computer plays until they do.</p></div><div class="st" id="st"></div><div id="mycol" style="position:fixed;left:8px;top:8px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;z-index:7;display:none;box-shadow:0 0 8px #0008"></div><div id="gstrip" style="position:fixed;z-index:4;pointer-events:none;border-radius:10px;background:linear-gradient(180deg,#ffd24a10,#ffd24a40);border:1px dashed #ffd24a99;display:none"><div style="position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:2px;opacity:.9;color:#ffd24a;font-weight:700">GOALIE ⟷</div></div><div id="otr" style="position:fixed;left:0;right:0;top:34px;text-align:center;z-index:6;font-weight:800;color:#ffb300;font-size:16px;opacity:0;transition:opacity .15s;pointer-events:none">ONE-TIMER READY</div>
<script>window.MINI = 'bubble';</script><script src="../minikit/peerjs.min.js"></script><script src="../minikit/qrcode.js"></script><script src="../minikit/kit.js"></script><script src="../minikit/net.js"></script><script src="tracks.js"></script><script src="sim.js"></script><script src="view.js"></script><script src="three.min.js"></script><script src="view3d.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); }, cv = $('cv'), R3 = null, dpr = 1, V = new BubbleView(), sim = null, host = null, c = null, st = null, team = 0, hand = 0, myCol = '#ffb300',  names = ['You', 'Computer'], trail = [];
  $('tip').textContent = 'drag a player along his slot \u00b7 your finger turns his stick \u00b7 flick toward a teammate to pass \u00b7 tap to shoot';
  function setCol(c) { myCol = c; var b = $('mycol'); b.style.background = c; b.style.display = 'block'; }
  function size() { dpr = devicePixelRatio || 1;  V.fit(innerWidth, innerHeight - 30, 34); } addEventListener('resize', size); size();
  function local(withHost) { var k = $('kjoin'); if (k) { var nmv = k.querySelector('#kname'); if (nmv) { c.name = (nmv.value || 'Player').trim(); localStorage.setItem('ztp-mini-name', c.name); names[0] = c.name; } mirror = !!(c.room && $('mir') && $('mir').checked); if (mirror) c.setName(c.name); k.remove(); } sim = new Bubble.Sim(); team = 0; V.team = 0; setCol(myCol); Kit.phase('play');
    if (withHost) { host = Kit.host({ max: 1, onJoin: function (p) { sim.ai[1] = false; names[1] = p.name; sim.reset(); $('hostq').style.display = 'none'; host.send(p, { t: 'team', team: 1 }); },
      onLeave: function () { sim.ai[1] = true; names[1] = 'Computer'; }, onMsg: function (p, m) { sim.input(1, m); } });
      host.qr($('hq')); $('hostq').style.display = 'block'; $('hostq').onclick = function () { this.style.display = 'none'; }; } }
  var mirror = false, mirT = 0;
  c = Kit.pad({ onMsg: function (m) { if (sim) return; if (m.t === 'team') { if (m.col) setCol(m.col); team = m.team; V.team = team; V.allow = m.allow || null; hand = m.hand == null ? team : m.hand; if (m.role) $('tip').textContent = 'you play ' + m.role + ' \u00b7 flick to pass \u00b7 tap to shoot'; } else if (m.t === 's') { st = m; if (m.names) names = m.names; } }, onStatus: function (s) { $('st').textContent = s === 'online' ? '' : s; } });
  var jc = Kit.joinCard('BUBBLE HOCKEY', c, (c.room ? '<label style="display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0 0;font-size:16px"><input type="checkbox" id="mir" checked style="width:22px;height:22px"> Also show on screen</label>' : '') + '<button class="btn" id="vsai">\uD83E\uDD16 Play the computer</button><button class="btn" id="host2">\uD83D\uDCF1\uD83D\uDCF1 Host a match for 2 phones</button><p style="font-size:13px">First to 5 or 3 minutes. Your goal is at the bottom.</p>');
  if (c.room) { jc.querySelector('#kgo').textContent = '\uD83D\uDCFA Use the TV as the table'; jc.querySelector('#kgo').classList.remove('go'); jc.querySelector('h1').insertAdjacentElement('afterend', jc.querySelector('#kname')); var vb = $('vsai'); vb.classList.add('go'); jc.querySelector('#kname').insertAdjacentElement('afterend', $('mir').parentNode); $('mir').parentNode.insertAdjacentElement('afterend', vb); }
  if ($('vsai')) { $('vsai').onclick = function () { local(false); }; $('host2').onclick = function () { local(true); }; }
  if (Kit.Q.get('solo') === '1') local(false); else if (Kit.Q.get('host') === '1') local(true);
  V.pick = function (X, Y) { return R3 && R3.pzc > .002 ? R3.toRink(X, Y) : null; };
  BubbleGestures(cv, V, function () { return st; }, function (m) { if (sim) sim.input(team, m); else c.send(m); });
  var last = 0, sendT = 0;
  (function loop(t) { var dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    if (sim) { sim.step(dt); st = sim.snap(); st.gc = st.u.map(function () { return null; }); if (sim.grab[0] >= 0) st.gc[sim.grab[0]] = myCol; if (sim.grab[1] >= 0) st.gc[sim.grab[1]] = '#00e5ff'; if (st.ev.indexOf('goal') === 0 && navigator.vibrate) navigator.vibrate(120); if (mirror) { mirT += dt; if (mirT > 1 / 20) { mirT = 0; st.names = [names[0], names[1]]; c.send({ t: 'mirror', s: st }); } } if (host && host.players[0]) { sendT += dt; if (sendT > 1 / 30) { sendT = 0; st.names = [names[0], names[1]]; host.send(host.players[0], st); } } }
        if (st) { R3 = R3 || new Bubble3D(cv, V, { phone: true }); R3.render(st, dt, { held: st.g ? st.g[sim ? team : hand] : -1 });
      var o = 1 - team, C = BubbleCOL; $('score').innerHTML = '<span style="color:' + C[team] + '">' + names[team === 0 ? 0 : 1].replace(/</g, '') + ' ' + st.sc[team] + '</span><span class="t">' + Math.floor(st.tm / 60) + ':' + ('0' + st.tm % 60).slice(-2) + '</span><span style="color:' + C[o] + '">' + st.sc[o] + ' ' + names[o].replace(/</g, '') + '</span>';
      var gs = $('gstrip'), Bq = Bubble, gl = team ? Bq.GY + .015 : Bq.L - Bq.GY - .015, ge = team ? -.04 : Bq.L + .04, g1 = V.w2s(0, gl), g2 = V.w2s(1, ge); if (V.allow && V.allow.indexOf(team * 6) < 0) gs.style.display = 'none'; else { gs.style.display = 'block'; gs.style.left = Math.min(g1[0], g2[0]) + 'px'; gs.style.width = Math.abs(g2[0] - g1[0]) + 'px'; gs.style.top = Math.min(g1[1], g2[1]) + 'px'; gs.style.height = Math.abs(g2[1] - g1[1]) + 'px'; }
      $('otr').style.opacity = st.ot && st.ot[team] ? 1 : 0;
      var b = $('big'); if (st.ov >= 0) { b.innerHTML = (st.ov === team ? 'YOU WIN!' : 'They win') + '<div style="font-size:.4em;color:#fff">tap to play again</div>'; b.style.opacity = 1; } else if (st.msg && st.msg !== 'GOAL!' && !(R3 && R3.replaying())) { b.textContent = st.msg; b.style.opacity = 1; } else b.style.opacity = 0; }
    requestAnimationFrame(loop); })(0);
  window.BHP = { get R3() { return R3; }, get sim() { return sim; }, V: V, get st() { return st; } };
})();
</script></body></html>
