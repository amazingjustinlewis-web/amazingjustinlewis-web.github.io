<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex, nofollow">
<title>Balloon Buddy</title><link rel="stylesheet" href="../minikit/kit.css"><link rel="stylesheet" href="buddy.css">
<style>body{display:flex;flex-direction:column;touch-action:manipulation}#sc{position:relative;flex:0 0 38vh}#cv{position:absolute;inset:0;width:100%;height:100%}#words{position:absolute;left:0;right:0;bottom:2%}#word{font-size:26px}#wrong{font-size:15px}</style></head><body>
<div id="sc"><canvas id="cv"></canvas><div id="words"><div id="word"></div><div id="wrong"></div></div></div><div id="ui"></div><div class="st" id="st"></div>
<script>window.MINI = 'buddy';</script><script src="../minikit/peerjs.min.js"></script><script src="../minikit/kit.js"></script><script src="../minikit/net.js"></script><script src="game.js"></script><script src="ui.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); }, cv = $('cv'), ctx = cv.getContext('2d'), dpr = 1, pub = null, c;
  var draw = BuddyUI($('ui'), function (m) { c.send(m); });
  c = Kit.pad({ onMsg: function (m) { if (m.t === 'st') { pub = m.s; draw(pub); $('word').textContent = pub.phase === 'set' || pub.phase === 'lobby' ? '' : pub.mask; $('wrong').textContent = pub.wrong.join(' '); } }, onStatus: function (s) { $('st').textContent = s; } });
  Kit.joinCard('BALLOON BUDDY', c, '<p>Hide a word or guess letters. Every wrong guess pops one of Buddy\u2019s balloons!</p>');
  function size() { dpr = devicePixelRatio || 1; cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr; } addEventListener('resize', size); size();
  (function loop(t) { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); Buddy.scene(ctx, cv.clientWidth, cv.clientHeight, pub, t / 1000); requestAnimationFrame(loop); })(0);
})();
</script></body></html>
