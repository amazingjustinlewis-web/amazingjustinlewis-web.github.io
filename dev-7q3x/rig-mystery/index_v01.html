<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>Rig Mystery (dev)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1420;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif;color:#f3ead2}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:8px;right:8px;top:8px;display:flex;gap:8px;align-items:center;font-size:13px;pointer-events:none}
.pill{background:#0009;border:1px solid #c9a24a66;border-radius:14px;padding:5px 10px}
#gauge{flex:1;height:10px;background:#0008;border-radius:6px;overflow:hidden;border:1px solid #c9a24a66}#gbar{height:100%;width:0;background:linear-gradient(90deg,#4caf50,#ffb300,#e53935)}
.btns{position:fixed;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:10px}
button{font:600 15px system-ui;color:#2a1a08;background:linear-gradient(#f4d98a,#c9a24a);border:0;border-radius:12px;padding:11px 16px;box-shadow:0 2px 6px #0008}
.panel{position:fixed;inset:0;display:none;background:#000a;align-items:center;justify-content:center;z-index:5}
.card{background:#f3ead2;color:#2a1a08;border-radius:14px;padding:16px;width:min(92vw,420px);max-height:84vh;overflow:auto;box-shadow:0 6px 30px #000}
.card h2{margin:0 0 8px;font-family:Georgia,serif}.card p{line-height:1.4}
.opt{display:block;width:100%;margin:6px 0;text-align:left;background:#fff;border:1px solid #c9a24a}
#map .card{width:min(96vw,560px);display:flex;gap:8px;padding:10px}
#mapc{flex:1;position:relative;aspect-ratio:1;background:#d9cfae;border-radius:10px;background-image:repeating-radial-gradient(circle at 40% 55%,#0000 0 14px,#8a7a5044 15px 16px)}
.spot{position:absolute;transform:translate(-50%,-50%);font:600 11px system-ui;background:#2a1a08;color:#f4d98a;border-radius:8px;padding:5px 7px;white-space:nowrap}
.spot.on{background:#4caf50;color:#fff;box-shadow:0 0 14px #4caf50}
#crewl{width:96px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.cm{display:flex;align-items:center;gap:4px;font-size:11px;background:#fff;border-radius:8px;padding:3px}
.face{width:22px;height:22px;border-radius:50%;flex:none;position:relative}
.face:after{content:"◡";position:absolute;left:0;right:0;top:3px;text-align:center;font-size:14px;color:#222}
#toast{position:fixed;left:50%;top:44px;transform:translateX(-50%);background:#000b;padding:8px 12px;border-radius:10px;font-size:14px;max-width:88vw;text-align:center;display:none;z-index:4}
#hint{position:fixed;left:0;right:0;bottom:64px;text-align:center;font-size:12px;opacity:.7;pointer-events:none}
</style></head><body>
<canvas id="cv"></canvas>
<div class="hud"><span class="pill" id="loc">Helideck</span><div id="gauge"><div id="gbar"></div></div><span class="pill" id="pts">0 pts</span></div>
<div id="toast"></div>
<div id="hint">Drag to look · tap a person to talk · press &amp; hold for the map</div>
<div class="btns"><button id="bLog">📖 Logbook</button><button id="bMap">🗺 Map</button><button id="bAcc">⚖ Call meeting</button></div>
<div class="panel" id="dlg"><div class="card" id="dlgc"></div></div>
<div class="panel" id="map"><div class="card"><div id="mapc"></div><div id="crewl"></div></div></div>
<script src="../minikit/three.min.js"></script>
<script src="rig_v01.js?b=1"></script>
</body></html>
