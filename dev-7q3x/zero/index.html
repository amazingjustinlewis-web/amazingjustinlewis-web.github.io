<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#030304">
<title>Zero to Phi</title>
<link rel="icon" href="../../assets/img/favicon.svg">
<style>
html,body{margin:0;height:100%;background:#030304;overflow:hidden}
body{display:grid;place-items:center;font-family:Georgia,"Times New Roman",serif;color:#e8cf86}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.logo{position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:28px;opacity:.22;pointer-events:none}
.play{position:fixed;left:50%;bottom:calc(7vh + env(safe-area-inset-bottom));transform:translateX(-50%);
 font:500 clamp(15px,2.1vmin + 8px,30px)/1 Georgia,serif;letter-spacing:.42em;white-space:nowrap;padding:1.05em 1.6em 1.05em 2em;
 color:#f3dc95;text-decoration:none;border:1px solid rgba(226,184,74,.55);border-radius:999px;
 background:rgba(8,7,4,.55);box-shadow:0 0 30px rgba(226,184,74,.10),inset 0 0 18px rgba(226,184,74,.06);
 transition:box-shadow .5s,border-color .5s,color .5s;-webkit-tap-highlight-color:transparent}
.play:hover,.play:focus-visible{outline:none;border-color:#f3dc95;color:#fff3cc;box-shadow:0 0 46px rgba(226,184,74,.32),inset 0 0 22px rgba(226,184,74,.12)}
.shops{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));
 font:11px/1 Georgia,serif;letter-spacing:.2em;color:rgba(200,170,90,.16);text-decoration:none}
.shops:hover,.shops:focus-visible{color:rgba(226,184,74,.6);outline:none}
</style></head><body>
<canvas id="c" aria-hidden="true"></canvas>
<img class="logo" src="../../assets/img/logo.svg" alt="">
<a class="play" href="../../family.html">PLAY NOW</a>
<a class="shops" href="../../business.html">for shops</a>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,D,PHI=(1+Math.sqrt(5))/2;
var still=matchMedia('(prefers-reduced-motion: reduce)');
var pts=[];
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);build()}
// zero geometry: tall oval, ~0.72 aspect
function zero(){var rh=Math.min(H*0.39,W*0.6),rw=rh*0.72;return{cx:W/2,cy:H*0.43,rw:rw,rh:rh}}
function build(){
 // golden (logarithmic) spiral: r = a*phi^(2θ/π); grows by phi each quarter turn
 var z=zero(),R=Math.min(z.rw,z.rh)*1.08,turns=4.25,th=turns*2*Math.PI,a=R/Math.pow(PHI,2*th/Math.PI),n=900;
 pts=[];for(var i=0;i<=n;i++){var t=i/n,q=t*th,r=a*Math.pow(PHI,2*q/Math.PI);pts.push([q,r,t])}
}
function wid(t,R){ // thread -> sharp widening -> thinning into nothing
 var s=Math.pow(t,6)*Math.pow(1-t,1.6);s/=Math.pow(6/7.6,6)*Math.pow(1.6/7.6,1.6);return 0.3+R*0.045*s}
function draw(ms){
 var T=still.matches?0:ms/1000,z=zero();
 x.clearRect(0,0,W,H);
 // faint vignette glow
 var g=x.createRadialGradient(z.cx,z.cy,0,z.cx,z.cy,Math.max(W,H)*0.7);
 g.addColorStop(0,'#0a0906');g.addColorStop(1,'#020203');x.fillStyle=g;x.fillRect(0,0,W,H);
 // the zero: thick dark ring, black-hole interior
 x.save();x.translate(z.cx,z.cy);
 var ring=z.rw*0.30;
 x.beginPath();x.ellipse(0,0,z.rw,z.rh,0,0,Math.PI*2);
 x.lineWidth=ring;x.strokeStyle='#0d0c0a';x.stroke();
 x.lineWidth=1;x.strokeStyle='rgba(226,184,74,0.05)';
 x.beginPath();x.ellipse(0,0,z.rw+ring/2,z.rh+ring/2,0,0,Math.PI*2);x.stroke();
 x.beginPath();x.ellipse(0,0,z.rw-ring/2,z.rh-ring/2,0,0,Math.PI*2);x.stroke();
 var h=x.createRadialGradient(0,0,0,0,0,z.rw);h.addColorStop(0,'#000');h.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=h;x.beginPath();x.ellipse(0,0,z.rw-ring/2,z.rh-ring/2,0,0,Math.PI*2);x.fill();
 // spiral, stretched to the oval, slowly turning and breathing
 var rot=T*0.018,br=1+0.012*Math.sin(T*0.35),sx=br,sy=br*z.rh/z.rw;
 var R=pts[pts.length-1][1],L=[],Rt=[];
 for(var i=0;i<pts.length;i++){var p=pts[i],q=p[0]+rot,r=p[1];
  var X=Math.cos(q)*r*sx,Y=Math.sin(q)*r*sy;
  var p2=pts[Math.min(i+1,pts.length-1)],p1=pts[Math.max(i-1,0)];
  var dx=Math.cos(p2[0]+rot)*p2[1]*sx-Math.cos(p1[0]+rot)*p1[1]*sx,dy=Math.sin(p2[0]+rot)*p2[1]*sy-Math.sin(p1[0]+rot)*p1[1]*sy,dl=Math.hypot(dx,dy)||1;
  var w=wid(p[2],R)/2;L.push([X-dy/dl*w,Y+dx/dl*w]);Rt.push([X+dy/dl*w,Y-dx/dl*w])}
 var gg=x.createRadialGradient(0,0,0,0,0,R*Math.max(sx,sy));
 var sh=0.5+0.5*Math.sin(T*0.5);
 gg.addColorStop(0,'rgba(255,240,190,0.95)');gg.addColorStop(0.45,'rgba(236,196,92,'+(0.85+0.1*sh)+')');
 gg.addColorStop(0.8,'rgba(192,138,34,0.45)');gg.addColorStop(1,'rgba(150,105,25,0)');
 x.beginPath();x.moveTo(L[0][0],L[0][1]);for(i=1;i<L.length;i++)x.lineTo(L[i][0],L[i][1]);
 for(i=Rt.length-1;i>=0;i--)x.lineTo(Rt[i][0],Rt[i][1]);x.closePath();
 x.shadowColor='rgba(226,184,74,0.35)';x.shadowBlur=12;x.fillStyle=gg;x.fill();
 x.restore();
 if(!still.matches)requestAnimationFrame(draw);
}
addEventListener('resize',function(){size();if(still.matches)draw(0)});
still.addEventListener&&still.addEventListener('change',function(){requestAnimationFrame(draw)});
size();requestAnimationFrame(draw);
})();
</script>
</body></html>
