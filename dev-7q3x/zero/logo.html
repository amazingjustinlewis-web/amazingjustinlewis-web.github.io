<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Zero to Phi</title>
<link rel="icon" href="../../assets/img/favicon.svg">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
svg#s{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;opacity:.18;transition:opacity .4s}
#ui:hover,#ui:focus-within{opacity:.8}
#ui button{font:12px Georgia,serif;width:28px;height:28px;border-radius:50%;border:1px solid #6b5422;background:#000;color:#c9a24a;cursor:pointer}
#ui button.on{border-color:#e2b84a;color:#f3dc95}
</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" aria-label="Zero to Phi">
 <defs>
  <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="-19.07" y1="-36.69" x2="78.98" y2="42.98"><stop offset="0" stop-color="#FBE7A1"/><stop offset=".5" stop-color="#E2B84A"/><stop offset="1" stop-color="#C08A22"/></linearGradient>
  <radialGradient id="hd"><stop offset="0" stop-color="#fff6d8"/><stop offset=".35" stop-color="#f3cf6a" stop-opacity=".9"/><stop offset="1" stop-color="#e2b84a" stop-opacity="0"/></radialGradient>
  <mask id="m" maskUnits="userSpaceOnUse" x="-200" y="-200" width="500" height="500"><rect x="-200" y="-200" width="500" height="500" fill="#fff"/><rect id="mq" fill="#000"/></mask>
 </defs>
 <g id="world">
  <g id="logo" fill="url(#g)"></g>
  <g id="qr" shape-rendering="crispEdges"><rect id="ql"/><path id="qd" fill="#050404"/></g>
  <g id="fx" mask="url(#m)"></g>
 </g>
</svg>
<div id="ui"><button data-m="1" aria-label="Comet">1</button><button data-m="2" aria-label="Heartbeat">2</button><button data-m="3" aria-label="Orbit">3</button></div>
<script src="../js/qrcode.js"></script>
<script>
(function(){
var NS='http://www.w3.org/2000/svg',PHI=(1+Math.sqrt(5))/2,qs=new URLSearchParams(location.search);
var still=matchMedia('(prefers-reduced-motion: reduce)').matches||qs.get('still')==='1',PULSE=qs.get('pulse')!=='0';
var mode=+qs.get('mode')||1;if(mode<1||mode>3)mode=1;
var svg=document.getElementById('s'),logo=document.getElementById('logo'),fx=document.getElementById('fx');
var VB={x:-19.07,y:-36.69,w:98.05,h:79.67},CX=0.06,CY=0.1; // centre of the 0's hollow
function fit(){var W=innerWidth,H=innerHeight,k=Math.min(W*0.9/VB.w,H*0.78/VB.h);
 // viewBox in logo units so the logo is centred and large
 var vw=W/k,vh=H/k,mx=VB.x+VB.w/2,my=VB.y+VB.h/2;svg.setAttribute('viewBox',(mx-vw/2)+' '+(my-vh/2)+' '+vw+' '+vh);
 // QR in the hollow of the 0, modules snapped to whole screen pixels
 var n=N+2*QZ,dpr=devicePixelRatio||1,mpx=Math.max(2,Math.floor(21*k*dpr/n))/dpr,u=mpx/k,S=u*n,o={x:CX-S/2,y:CY-S/2};
 var ql=document.getElementById('ql');ql.setAttribute('x',o.x);ql.setAttribute('y',o.y);ql.setAttribute('width',S);ql.setAttribute('height',S);
 var d='';for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(Q.isDark(r,c))d+='M'+(o.x+(c+QZ)*u)+' '+(o.y+(r+QZ)*u)+'h'+u+'v'+u+'h-'+u+'z';
 document.getElementById('qd').setAttribute('d',d);
 var mq=document.getElementById('mq'),pad=u*1.5;mq.setAttribute('x',o.x-pad);mq.setAttribute('y',o.y-pad);mq.setAttribute('width',S+2*pad);mq.setAttribute('height',S+2*pad);
 SC=k;}
var Q=qrcode(0,'H');Q.addData('https://amazingjustinlewis-web.github.io/');Q.make();var N=Q.getModuleCount(),QZ=4,SC=1;
// QR breath: 8 s rise (overshoot, gentle landing) / hang / soft dip / hidden
function qrLevel(T){if(still||!PULSE)return 1;var u=T%8;
 if(u<1.5){var t=u/1.5;return 1+2.9*Math.pow(t-1,3)+1.9*Math.pow(t-1,2)}
 if(u<6.6)return 1+0.03*Math.sin((u-1.5)/5.1*Math.PI);
 if(u<7.6)return 0.5+0.5*Math.cos(Math.PI*(u-6.6));return 0}
function mix(k){var a=[0,0,0],b=[92,69,25];return 'rgb('+a.map(function(v,i){return Math.max(0,Math.round(v+(b[i]-v)*k))}).join(',')+')'}
// golden easing: sigmoid with exponent phi
function gold(t){var a=Math.pow(t,PHI),b=Math.pow(1-t,PHI);return a/(a+b)}
var paths=[],lens=[],TOT=0,TR=36,dots=[];
function el(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e}
for(var i=0;i<TR;i++){var c=el('circle',{r:0,fill:'url(#hd)'});fx.appendChild(c);dots.push(c)}
var seeds=[];for(i=0;i<34;i++){var c2=el('circle',{r:.35,fill:'#e2b84a',opacity:0});fx.appendChild(c2);seeds.push(c2)}
function at(s){s=((s%TOT)+TOT)%TOT;for(var i=0;i<paths.length;i++){if(s<=lens[i])return paths[i].getPointAtLength(s);s-=lens[i]}return paths[0].getPointAtLength(0)}
// golden spiral from the logo centre (mode 2)
var GX=VB.x+VB.w/2,GY=VB.y+VB.h/2;
function spiral(t){var th=t*4*Math.PI,a=1.2,r=a*Math.pow(PHI,2*th/Math.PI);r=Math.min(r,60);return{x:CX+Math.cos(th-1.2)*r,y:CY+Math.sin(th-1.2)*r*1.1}}
function draw(ms){
 var T=still?3:ms/1000,k=qrLevel(T);
 document.getElementById('ql').setAttribute('fill',mix(k));document.getElementById('qd').setAttribute('fill',mix(Math.min(1,k)*0.055));
 var i,p,h,pts=[];
 if(mode===1){ // comet along the outline, one lap every phi^3 s, golden-eased
  var L=Math.pow(PHI,3),t=(T%L)/L,s=gold(t)*TOT;
  for(i=0;i<TR;i++){p=at(s-i*TOT*0.0045);pts.push([p.x,p.y,1-i/TR])}}
 else if(mode===2){ // lub-dub heartbeat: beats 1/phi apart, period phi^2
  var P=PHI*PHI,u=T%P;
  [0,1/PHI].forEach(function(b0,j){var tt=(u-b0)/1.3;if(tt<0||tt>1)return;var e=1-Math.pow(1-tt,PHI*2);
   for(var q=0;q<TR/2;q++){var tq=Math.max(0,e-q*0.012);var sp=spiral(tq);pts.push([sp.x,sp.y,(1-q/(TR/2))*(1-tt)*(j?0.75:1)])}});
  var beat=Math.max(0,1-Math.abs(u)*3)+0.7*Math.max(0,1-Math.abs(u-1/PHI)*3);
  logo.style.filter='drop-shadow(0 0 '+(0.3+1.4*beat)+'px rgba(240,200,100,'+(0.25+0.5*beat)+'))'}
 else { // Lissajous comet (3:2 with phi phase) + golden-angle seeds
  var w=T*0.55;for(i=0;i<TR;i++){var ww=w-i*0.025;pts.push([GX+52*Math.sin(3*ww+PHI),GY+40*Math.sin(2*ww),1-i/TR])}
  var GA=Math.PI*(3-Math.sqrt(5));for(i=0;i<seeds.length;i++){var an=i*GA+T*0.08,rr=46+18*Math.sqrt(i/seeds.length);
   seeds[i].setAttribute('cx',GX+Math.cos(an)*rr*1.12);seeds[i].setAttribute('cy',GY+Math.sin(an)*rr*0.86);seeds[i].setAttribute('opacity',(0.15+0.25*(0.5+0.5*Math.sin(T*1.3+i*GA))).toFixed(3))}}
 if(mode!==2)logo.style.filter='';
 for(i=0;i<TR;i++){var d=dots[i];if(i<pts.length&&pts[i][2]>0){d.setAttribute('cx',pts[i][0]);d.setAttribute('cy',pts[i][1]);
   var f=pts[i][2];d.setAttribute('r',(0.4+ (i===0?2.6:1.8)*f*f).toFixed(3));d.setAttribute('opacity',(f*0.95).toFixed(3))}else d.setAttribute('r',0)}
 for(i=0;i<seeds.length;i++)seeds[i].style.display=mode===3?'':'none';
 if(!still)requestAnimationFrame(draw)}
function set(m){mode=m;[].forEach.call(document.querySelectorAll('#ui button'),function(b){b.classList.toggle('on',+b.dataset.m===m)});if(still)draw(0)}
document.getElementById('ui').onclick=function(e){var b=e.target.closest('button');if(b)set(+b.dataset.m)};
addEventListener('keydown',function(e){if(e.key>='1'&&e.key<='3')set(+e.key)});
fetch('../../assets/img/logo.svg').then(function(r){return r.text()}).then(function(t){
 var doc=new DOMParser().parseFromString(t,'image/svg+xml');[].forEach.call(doc.querySelectorAll('path'),function(p){var q=el('path',{d:p.getAttribute('d')});logo.appendChild(q);paths.push(q)});
 lens=paths.map(function(p){return p.getTotalLength()});TOT=lens.reduce(function(a,b){return a+b},0);
 fit();addEventListener('resize',fit);set(mode);document.documentElement.dataset.ready=1;requestAnimationFrame(draw)});
})();
</script>
</body></html>
