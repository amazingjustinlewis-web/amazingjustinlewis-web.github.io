<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex, nofollow">
<title>Iron Stride Squad - Titan</title>
<style>
@font-face{font-family:Fredoka;src:url(../../games/mech/assets/fredoka-latin-var.woff2) format('woff2');font-weight:300 700}
html,body{margin:0;height:100%;background:#0d1218;color:#fff;font-family:Fredoka,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#join{padding:18px}#join h1{color:#ffb02e;font-size:24px;margin:0 0 12px}#join input{width:100%;box-sizing:border-box;font:inherit;font-size:20px;padding:12px;border-radius:12px;border:0;margin:4px 0 12px}
button{font:inherit;border:0;border-radius:14px;color:#111;font-weight:700}#go{width:100%;padding:14px;font-size:20px;background:#ffb02e}
#play{display:none;position:fixed;inset:0;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0008;font-size:15px}#hp{flex:1;height:10px;background:#333;border-radius:6px;overflow:hidden}#hp i{display:block;height:100%;background:#7ed957}
#map{flex:1;width:100%;display:block}
#info{position:absolute;left:10px;right:10px;top:46px;text-align:center;font-size:14px;pointer-events:none}#info span{background:#000b;border-radius:8px;padding:4px 10px;display:inline-block}
#bar{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
#bar button{position:relative;overflow:hidden;padding:14px 4px;font-size:16px;background:#ffb02e}#bar button small{display:block;font-weight:500;font-size:11px;opacity:.75}
#bar button s{position:absolute;left:0;bottom:0;height:5px;background:#0006}#bar button.cd{background:#5a4a30;color:#ccc}
#bar .sm{background:#3a4a5a;color:#fff;padding:10px 4px;font-size:14px}#bar .sm.on{background:#3ae0ff;color:#111}
#zoom{position:absolute;right:10px;top:84px;display:flex;flex-direction:column;gap:6px}#zoom button{width:44px;height:44px;font-size:22px;background:#000a;color:#fff}
#start{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);padding:16px 30px;font-size:22px;background:#ffb02e;display:none}
</style></head><body>
<div id="join"><h1>IRON STRIDE SQUAD &middot; TITAN</h1><div style="font-size:14px;color:#bcd;margin-bottom:12px">Your phone pilots a giant: slow, six times bigger, heavy guns. Tap the map to walk. Tap a red enemy to lock it. Your siege cannon fires on its own when it can see the target. Buildings block shots, so walk around them.</div>
<input id="room" placeholder="Room" maxlength="4" autocapitalize="characters"><input id="name" placeholder="Pilot name" maxlength="12"><button id="go">BOARD TITAN</button><div id="st" style="margin-top:10px;color:#f99"></div></div>
<div id="play"><div id="top"><b id="me">TITAN</b><div id="hp"><i></i></div><span id="sc"></span></div><canvas id="map"></canvas><div id="info"></div>
<div id="zoom"><button id="zi">+</button><button id="zo">&minus;</button></div><button id="start">START</button>
<div id="bar"><button id="bSiege">SIEGE<small>fire at lock</small><s></s></button><button id="bBarrage">BARRAGE<small>8 missiles</small><s></s></button><button id="bJump">JUMP<small>booster hop</small><s></s></button><button id="bStomp">STOMP<small>shockwave</small><s></s></button>
<button class="sm on" id="bAuto">Auto-fire ON</button><button class="sm" id="bHold">Stop walking</button><button class="sm" id="bClear">Clear lock</button></div></div>
<script src="../../games/mech/js/vendor/peerjs.min.js"></script>
<script src="../../games/mech/js/config.js"></script>
<script src="../../games/mech/js/world.js"></script>
<script src="js/squad-config.js"></script>
<script src="../../games/mech/js/net.js"></script>
<script src="js/phone.js"></script>
<script src="../js/ztp-playbar.js" data-here="phone" data-screen="index.html" data-phone="phone.html"></script>
</body></html>
