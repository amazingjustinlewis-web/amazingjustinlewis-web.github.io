<canvas id="cv" class="full"></canvas><div id="board"></div><div id="msg">Scan to join · tap your phone map to fly</div><div id="join"></div>
<script>window.MINI = 'rts';</script><script src="../minikit/peerjs.min.js"></script><script src="../minikit/qrcode.js"></script><script src="../minikit/kit.js"></script><script src="../minikit/perf.js"></script><script src="../minikit/net.js"></script>

  // ---------- fliers (authoritative state) ----------
  var F = {}, order = [];
  function spawn(p) { var a = order.length * 1.3, x = Math.cos(a) * 8, z = Math.sin(a) * 8, f = { id: p.id, name: p.name, col: p.color, p: new THREE.Vector3(x, T.h(x, z) + FLY.alt, z), v: new THREE.Vector3(), yaw: a, bank: 0, dest: null, ph: Math.random() * 6, flapHz: FLY.flapIdle, model: null, moving: false, alt: T.h(x, z) + FLY.alt };
    F[p.id] = f; order.push(p.id); makeModel(p.color, function (m) { if (!F[p.id]) return; f.model = m; scene.add(m.root); }); }
  function despawn(id) { var f = F[id]; if (!f) return; if (f.model) scene.remove(f.model.root); delete F[id]; order = order.filter(function (q) { return q !== id; }); }
  // destination ripple ring on the terrain
  var rings = [];
  function ripple(x, z, col) { var m = new THREE.Mesh(new THREE.RingGeometry(.6, 1, 32), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: .9, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.set(x, T.h(x, z) + .15, z); scene.add(m); rings.push({ m: m, t: 0 }); }
  function groundMax(x, z) { var m = -99; for (var k = 0; k < 5; k++) { var a = k * 1.26, y = T.h(x + Math.cos(a) * 3, z + Math.sin(a) * 3); if (y > m) m = y; } return Math.max(m, T.h(x, z), -1.2); }
  var tmp = new THREE.Vector3(), want = new THREE.Vector3();
  function stepF(f, dt) { var flying = false;
    if (f.dest) { tmp.set(f.dest.x - f.p.x, 0, f.dest.z - f.p.z); var d = tmp.length();
      if (d < FLY.arrive && f.v.length() < 1.2) { f.dest = null; } else { flying = true; var sp = Math.min(FLY.maxV, Math.sqrt(2 * FLY.brake * Math.max(0, d - FLY.arrive * .5))); want.copy(tmp).multiplyScalar(sp / Math.max(d, 1e-3)); } }
    if (!flying) want.set(0, 0, 0);
    var hv = tmp.set(f.v.x, 0, f.v.z), dv = want.clone().sub(hv), lim = (want.lengthSq() > hv.lengthSq() ? FLY.acc : FLY.brake) * dt, dl = dv.length(); if (dl > lim) dv.multiplyScalar(lim / dl);

    var hs = Math.hypot(f.v.x, f.v.z); f.p.x += f.v.x * dt; f.p.z += f.v.z * dt; var lim2 = S * .46, rr = Math.hypot(f.p.x, f.p.z); if (rr > lim2) { f.p.x *= lim2 / rr; f.p.z *= lim2 / rr; }
