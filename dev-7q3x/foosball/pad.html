<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>Foosball</title><link rel="stylesheet" href="../minikit/kit.css">
<style>body{background:#10140f}#score{position:fixed;left:0;right:0;top:6px;text-align:center;z-index:5;font-size:20px;font-weight:700}#score span.t{font-weight:400;opacity:.6;font-size:14px;margin:0 10px}
#hostq{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:210px;background:#000c;border-radius:16px;padding:12px;text-align:center;z-index:7;display:none}#hostq .kcode{font-size:24px}#kjoin .btn{width:100%;margin-top:8px}
#tip{position:fixed;left:0;right:0;bottom:8px;text-align:center;font-size:12px;opacity:.6;z-index:4;pointer-events:none}</style></head><body>
<canvas id="cv" class="full"></canvas><div id="score"></div><div class="big" id="big" style="opacity:0"></div><div id="tip">grab near a rod · slide sideways to move it · slide up/down to spin the men · flick up fast to drill it</div>
<div id="hostq"><div id="hq"></div><p style="margin:6px 0 0;font-size:14px">Friend scans to join.<br>The computer plays until they do.</p></div><div class="st" id="st"></div>
<script>window.MINI = 'foosball';</script><script src="../minikit/peerjs.min.js"></script><script src="../minikit/qrcode.js"></script><script src="../minikit/kit.js"></script><script src="../minikit/net.js"></script><script src="sim.js"></script><script src="view.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); }, cv = $('cv'), ctx = cv.getContext('2d'), V = new FoosView(), sim = null, host = null, c = null, st = null, team = 0, rods = null, names = ['You', 'Computer'];
  function size() { var d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); V.fit(innerWidth, innerHeight - 24, 34, false); } addEventListener('resize', size); size();
  function local(withHost) { var k = $('kjoin'); if (k) { var nmv = k.querySelector('#kname'); if (nmv) { c.name = (nmv.value || 'Player').trim(); localStorage.setItem('ztp-mini-name', c.name); names[0] = c.name; } k.remove(); } sim = new Foos.Sim(); team = 0; V.team = 0; Kit.phase('play');
    if (withHost) { host = Kit.host({ max: 1, onJoin: function (p) { sim.ai[1] = false; names[1] = p.name; sim.reset(); $('hostq').style.display = 'none'; host.send(p, { t: 'team', team: 1, rods: null }); },
      onLeave: function () { sim.ai[1] = true; names[1] = 'Computer'; }, onMsg: function (p, m) { sim.input(1, 1, null, m); } });
      host.qr($('hq')); $('hostq').style.display = 'block'; $('hostq').onclick = function () { this.style.display = 'none'; }; } }
  c = Kit.pad({ onMsg: function (m) { if (sim) return; if (m.t === 'team') { team = m.team; rods = m.rods; V.team = team; } else if (m.t === 's') { st = m; if (m.names) names = m.names; } }, onStatus: function (s) { $('st').textContent = s === 'online' ? '' : s; } });
  var jc = Kit.joinCard('FOOSBALL', c, '<button class="btn" id="vsai">\uD83E\uDD16 Play the computer</button><button class="btn" id="host2">\uD83D\uDCF1\uD83D\uDCF1 Host a match for 2 phones</button><p style="font-size:13px">First to 5. Your goal is at the bottom. On a TV, 2 phones per side split the rods (back two / front two).</p>');
  if (c.room) { jc.querySelector('#kgo').textContent = '\uD83D\uDCFA Join the TV table'; }
  $('vsai').onclick = function () { local(false); }; $('host2').onclick = function () { local(true); };
  if (Kit.Q.get('solo') === '1') local(false); else if (Kit.Q.get('host') === '1') local(true);
  FoosGestures(cv, V, function (m) { if (sim) sim.input(0, 0, null, m); else c.send(m); });
  var last = 0, sendT = 0;
  (function loop(t) { var dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    if (sim) { sim.step(dt); st = sim.snap(); if (st.ev.indexOf('goal') === 0 && navigator.vibrate) navigator.vibrate(120); if (host && host.players[0]) { sendT += dt; if (sendT > 1 / 30) { sendT = 0; st.names = [names[0], names[1]]; host.send(host.players[0], st); } } }
    if (st) { V.draw(ctx, st, { myRods: rods || Foos.R.map(function (d, i) { return d.t === team ? i : -1; }) });
      var o = 1 - team, C = FoosCOL, me = names[team] || 'You'; $('score').innerHTML = '<span style="color:' + C[team] + '">' + String(me).replace(/</g, '') + ' ' + st.sc[team] + '</span><span class="t">first to 5</span><span style="color:' + C[o] + '">' + st.sc[o] + ' ' + String(names[o]).replace(/</g, '') + '</span>';
      var b = $('big'); if (st.ov >= 0) { b.innerHTML = (st.ov === team ? 'YOU WIN!' : 'They win') + '<div style="font-size:.4em;color:#fff">tap to play again</div>'; b.style.opacity = 1; } else if (st.msg) { b.textContent = st.msg; b.style.opacity = 1; } else b.style.opacity = 0; }
    requestAnimationFrame(loop); })(0);
  window.FP = { get sim() { return sim; }, V: V, get st() { return st; } };
})();
</script></body></html>
