<title>Splash Clown (dev)</title><link rel="stylesheet" href="../minikit/kit.css">
<style>#board{position:fixed;left:12px;top:12px;font-size:clamp(14px,2.4vh,22px);z-index:4}#board div{background:#0009;border-radius:10px;padding:3px 10px;margin-bottom:5px;border-left:5px solid}body.ph #join{display:none}</style></head><body>
<canvas id="cv" class="full"></canvas><div id="board"></div><div id="join"></div><div class="big" id="big" style="top:8%"></div>
<script>window.MINI = 'dunk';</script><script src="../minikit/peerjs.min.js"></script><script src="../minikit/qrcode.js"></script><script src="../minikit/kit.js"></script><script src="../minikit/net.js"></script><script src="../../assets/js/ztp-end.js"></script><script src="../minikit/throw3d.js"></script>
<script>
(function () {

          else if (d < TR + .09) { b.v[2] = -b.v[2] * .4; b.hit = true; } }

      }

    });

  }
  function quad(P, pts, col) { ctx.fillStyle = col; ctx.beginPath(); pts.forEach(function (q, i) { var s = P(q[0], q[1], q[2]); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); }); ctx.closePath(); ctx.fill(); }
  function drawClown(P) {
    var c = P(-.15, clown.y + .25, 5.0), u = c[2] * 1.6; ctx.save(); ctx.translate(c[0], c[1]); var wob = Math.sin(clown.t * (clown.st === 'sit' ? 2 : 6)) * .05; ctx.rotate(wob);
    ctx.fillStyle = '#3aa8ff'; ctx.beginPath(); ctx.ellipse(0, .15 * u, .3 * u, .4 * u, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffc93f'; [[-.12, .05], [.1, .2], [-.05, .35], [.15, -.05]].forEach(function (d) { ctx.beginPath(); ctx.arc(d[0] * u, d[1] * u, .05 * u, 0, 7); ctx.fill(); });
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-.25 * u, -.2 * u); ctx.lineTo(.25 * u, -.2 * u); ctx.lineTo(0, -.08 * u); ctx.fill();
    ['#ff5a6e', '#5fdc7a', '#c77dff'].forEach(function (col, i) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc((i - 1) * .22 * u, -.48 * u - Math.abs(i - 1) * -.04 * u, .13 * u, 0, 7); ctx.fill(); });
    ctx.fillStyle = '#fff3e6'; ctx.beginPath(); ctx.arc(0, -.4 * u, .19 * u, 0, 7); ctx.fill();
    var wet = clown.st !== 'sit' && clown.st !== 'climb';
    ctx.fillStyle = '#222'; [-1, 1].forEach(function (s) { if (wet) { ctx.fillRect(s * .07 * u - .04 * u, -.45 * u, .08 * u, .015 * u); } else { ctx.beginPath(); ctx.arc(s * .07 * u, -.45 * u, .025 * u, 0, 7); ctx.fill(); } });
    ctx.fillStyle = '#ff2a3a'; ctx.beginPath(); ctx.arc(0, -.38 * u, .05 * u, 0, 7); ctx.fill();
    ctx.strokeStyle = '#d0203a'; ctx.lineWidth = .02 * u; ctx.beginPath(); if (wet) ctx.ellipse(0, -.3 * u, .05 * u, .035 * u, 0, 0, 7); else ctx.arc(0, -.35 * u, .1 * u, .2, Math.PI - .2); ctx.stroke();
    ctx.restore();
    if (clown.sayT > 0) { ctx.font = '600 ' + Math.round(innerHeight * .032) + 'px Fredoka,sans-serif'; var w = ctx.measureText(clown.say).width + 24, bx = c[0] + .35 * u, by = P(0, 3.3, 5)[1]; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(bx, by, w, innerHeight * .06, 14); ctx.fill(); ctx.fillStyle = '#222'; ctx.textAlign = 'left'; ctx.fillText(clown.say, bx + 12, by + innerHeight * .042); }
  }
  function draw(t) {
    var W = innerWidth, H = innerHeight, P = T3.cam(W, H, { x: .1, y: 1.7, z: .4, hy: .6, f: .6 });
    var bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#2a5a8a'); bg.addColorStop(.55, '#9ad0f0'); bg.addColorStop(.56, '#4a8a3a'); bg.addColorStop(1, '#2a5a20'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? '#ff5a6e' : '#fff'; var a = P(-6 + i * 1.5, 4.6, 8), b = P(-6 + i * 1.5 + 1.5, 4.6, 8); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo((a[0] + b[0]) / 2, a[1] + H * .06); ctx.fill(); }
    quad(P, [[-1.2, 0, 4.6], [1.2, 0, 4.6], [1.2, 0, 5.8], [-1.2, 0, 5.8]], '#555');
    quad(P, [[-1.2, 0, 5.8], [1.2, 0, 5.8], [1.2, 3.4, 5.8], [-1.2, 3.4, 5.8]], '#c8443a');
    quad(P, [[-1.1, SEAT - .25, 4.7], [-.1, SEAT - .25, 4.7], [-.1, SEAT - .2, 5.3], [-1.1, SEAT - .2, 5.3]], clown.st === 'sit' ? '#8a5a2e' : '#8a5a2e00');
    if (clown.st !== 'sit') { var hp = P(-.1, SEAT - .25, 4.9), ep = P(-.1, SEAT - 1, 4.9); ctx.strokeStyle = '#8a5a2e'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(hp[0], hp[1]); ctx.lineTo(ep[0] - 10, ep[1]); ctx.stroke(); }
    drawClown(P);
    quad(P, [[-1.2, 0, 4.6], [1.2, 0, 4.6], [1.2, WATER, 4.6], [-1.2, WATER, 4.6]], '#3aa8ffb0');
    var wl = P(-1.2, WATER, 4.6), wr = P(1.2, WATER, 4.6); ctx.strokeStyle = '#d0f0ff'; ctx.lineWidth = 3; ctx.beginPath(); for (var x = 0; x <= 20; x++) { var X = wl[0] + (wr[0] - wl[0]) * x / 20; ctx.lineTo(X, wl[1] + Math.sin(t * 3 + x) * 3); } ctx.stroke();
    ctx.fillStyle = '#d0f0ff'; drops.forEach(function (d) { var s = P(d.x, d.y, d.z); ctx.beginPath(); ctx.arc(s[0], s[1], s[2] * .03, 0, 7); ctx.fill(); });
    ctx.strokeStyle = '#ddd8'; ctx.lineWidth = 2; for (var gx = -1.1; gx <= 1.11; gx += .2) { var a1 = P(gx, WATER, CAGE), a2 = P(gx, 3.3, CAGE); ctx.beginPath(); ctx.moveTo(a1[0], a1[1]); ctx.lineTo(a2[0], a2[1]); ctx.stroke(); }
    for (var gy = WATER; gy <= 3.31; gy += .2) { var c1 = P(-1.1, gy, CAGE), c2 = P(1.1, gy, CAGE); ctx.beginPath(); ctx.moveTo(c1[0], c1[1]); ctx.lineTo(c2[0], c2[1]); ctx.stroke(); }
    var pt = P(TGT[0], TGT[1], TGT[2]); ctx.strokeStyle = '#fff6'; ctx.lineWidth = 3; ctx.setLineDash([8, 8]); ctx.strokeRect(P(-.45, 1.5, TGT[2])[0], P(-.45, 1.5, TGT[2])[1], P(.45, 1.05, TGT[2])[0] - P(-.45, 1.5, TGT[2])[0], P(.45, 1.05, TGT[2])[1] - P(-.45, 1.5, TGT[2])[1]); ctx.setLineDash([]);

    fx = fx.filter(function (f) { f.t += 1 / 60; return f.t < 1.4; }); fx.forEach(function (f) { ctx.globalAlpha = 1 - f.t / 1.4; ctx.fillStyle = f.c; ctx.font = '700 ' + Math.round(H * .08) + 'px Fredoka,sans-serif'; ctx.textAlign = 'center'; ctx.fillText(f.txt, W / 2, H * (.25 - f.t * .08)); ctx.globalAlpha = 1; });
  }
  function board() {
    $('board').innerHTML = PL.map(function (p) { return '<div style="border-color:' + p.g.color + '">' + p.g.name + ' \uD83D\uDCA6 <b>' + p.g.dunks + '</b> <small>' + '\u25CF'.repeat(p.g.left) + '</small></div>'; }).join('');
    var big = $('big'); big.style.opacity = S.phase === 'play' ? 0 : 1;
    if (S.phase === 'ready') big.innerHTML = 'SPLASH CLOWN<div style="font-size:.4em;color:#fff">' + (phone ? 'flick the ball at the red target' : 'scan to join, then flick on your phone') + ' \u00b7 ' + BALLS + ' balls each</div>';
    else if (S.phase === 'over') { var w = PL.slice().sort(function (a, b) { return b.g.dunks - a.g.dunks; })[0]; big.innerHTML = 'GAME OVER<div style="font-size:.45em;color:#fff">' + (w ? w.g.name + ' dunked him ' + w.g.dunks + 'x' : '') + '<br><span style="font-size:.7em">flick to play again</span></div>'; }
    if (host) host.players.forEach(function (p) { if (p.g) host.send(p, { t: 'st', dunks: p.g.dunks, left: p.g.left, phase: S.phase, live: false }); });
  }

  window.DK = { S: S, PL: PL, shoot: shoot, localP: localP, step: step, clown: clown, TGT: TGT };
  Kit.over(function () { return S.phase === 'over'; }, 40000);
})();
