<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bloat Flier – polish v02</title>
<style>html,body{margin:0;height:100%;background:#12141a;color:#cde;font:14px sans-serif;overflow:hidden}#ui{position:fixed;top:10px;left:10px;background:#0008;padding:8px 12px;border-radius:6px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
</head><body><div id="ui"><b>Bloat Flier</b> polish v02 · <span id="info">loading…</span><br>
<label><input type="checkbox" id="play" checked> play</label> · speed <input type="range" id="spd" min="0" max="2" step="0.05" value="1"> · <label><input type="checkbox" id="wire"> wire</label> · clip <select id="clip"></select> · <a style="color:#8cf" href="?v=1">v01</a></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(devicePixelRatio);r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0x12141a);
const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.01,100);cam.position.set(3.5,1.8,4.5);
const oc=new OrbitControls(cam,r.domElement);oc.enableDamping=true;
s.add(new THREE.HemisphereLight(0xbfd8ff,0x302020,1.6));const d=new THREE.DirectionalLight(0xffffff,2.5);d.position.set(3,5,4);s.add(d);
const g=new THREE.GridHelper(6,12,0x335,0x223);g.position.y=-1.2;s.add(g);
let mix,mats=[];const clock=new THREE.Clock();
new GLTFLoader().load((new URLSearchParams(location.search).get('v')==='1'?'BloatFlier_polish_v01.glb':'BloatFlier_polish_v02.glb'),gl=>{s.add(gl.scene);let tris=0;
 gl.scene.traverse(o=>{if(o.isMesh){mats.push(o.material);tris+=o.geometry.index?o.geometry.index.count/3:0;}});
 mix=new THREE.AnimationMixer(gl.scene);const sel=document.getElementById('clip');gl.animations.forEach((a,i)=>{const o=document.createElement('option');o.value=i;o.textContent=a.name;sel.appendChild(o);});let cur=mix.clipAction(gl.animations[0]);cur.play();sel.onchange=()=>{cur.stop();cur=mix.clipAction(gl.animations[sel.value]);cur.play();};
 document.getElementById('info').textContent=`${tris} tris · ${gl.animations.map(a=>a.name+' '+a.duration.toFixed(2)+'s').join(', ')}`;});
document.getElementById('wire').onchange=e=>mats.flat().forEach(m=>m.wireframe=e.target.checked);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
r.setAnimationLoop(()=>{const dt=clock.getDelta();if(mix&&document.getElementById('play').checked)mix.update(dt*document.getElementById('spd').value);oc.update();r.render(s,cam)});
</script></body></html>
