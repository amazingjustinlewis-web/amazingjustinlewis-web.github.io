<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0d1020">
<title>Dev remote</title>
<style>
@font-face{font-family:Fredoka;src:url(../games/walker/assets/fredoka-latin-var.woff2) format('woff2');font-weight:300 700}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1020;color:#eef;font-family:Fredoka,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:absolute;inset:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
#top{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:#9aa3c8}
#dot{width:12px;height:12px;border-radius:50%;background:#c44;display:inline-block;margin-right:6px;vertical-align:middle}#dot.on{background:#7ed957}
#now{font-size:15px;color:#ffd23f}
#deck{position:relative;flex:1;min-height:0}
.c{position:absolute;left:8%;right:8%;top:4%;bottom:4%;border-radius:22px;background:#1b2140;box-shadow:0 10px 30px #0009;overflow:hidden;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.c .im{flex:1;background:#2a3160 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:90px}
.c .cp{padding:14px 16px}.c .nm{font-size:26px;font-weight:600}.c .vr{color:#ffd23f;font-size:18px;margin-left:8px}.c .tg{display:block;color:#9aa3c8;font-size:15px;margin-top:2px}
.c .last{position:absolute;top:12px;left:12px;background:#7ed957;color:#08240a;font-size:13px;padding:3px 9px;border-radius:9px;font-weight:600}
#dots{text-align:center;font-size:13px;color:#6f78a0;height:16px}
button{font:inherit;border:0;border-radius:18px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#launch{font-size:28px;padding:18px;background:#7ed957;color:#08240a;font-weight:600;box-shadow:inset 0 -6px 0 #0002}
#row{display:flex;gap:10px}
#row button{flex:1;font-size:19px;padding:16px 8px;background:#2a3160;color:#fff}
#backBtn{background:#ff8f6b!important;color:#2a0d00!important;font-weight:600}
#backBtn:disabled,#reload:disabled{opacity:.35}
#join{position:absolute;inset:0;background:#0d1020;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;text-align:center;padding:20px}
#join input{font:inherit;font-size:40px;width:5ch;text-align:center;letter-spacing:.2em;text-transform:uppercase;border-radius:16px;border:3px solid #ffd23f;background:#1b2140;color:#fff;padding:8px}
#join button{font-size:24px;padding:12px 28px;background:#7ed957;color:#08240a}
</style></head><body>
<div id="app">
  <div id="top"><span><span id="dot"></span><span id="stt">connecting…</span></span><span id="now"></span></div>
  <div id="deck"></div>
  <div id="dots"></div>
  <button id="launch">&#x25B6; Launch</button>
  <div id="row"><button id="backBtn" disabled>&#x2190; Back to launcher</button><button id="reload" disabled>&#x21bb; Reload game</button></div>
</div>
<div id="join"><div style="font-size:20px">Dev remote: type the code on the projector</div><input id="code" maxlength="4" placeholder="ABCD" autocomplete="off"><button id="go">Link</button></div>
<script src="js/peerjs.min.js"></script>
<script>if (typeof Peer !== 'function') document.write('<script src="js/peerjs.legacy.min.js"><\/script>');</script>
<script>window.LR_CONFIG = { peerPrefix: 'ztp-dev7q3x-v1-', iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };</script>
<script src="js/net.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), $ = function (i) { return document.getElementById(i); };
  var code = (q.get('room') || localStorage.getItem('dev7q3x-rroom') || '').toUpperCase(), S = { list: [], sel: 0 }, net = null, cur = 0;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function draw() {
    var L = S.list, d = $('deck'); d.innerHTML = '';
    L.forEach(function (g, i) {
      var k = i - cur; if (Math.abs(k) > 2) return;
      var c = document.createElement('div'); c.className = 'c';
      c.innerHTML = '<div class="im"' + (g.img ? ' style="background-image:url(\'' + esc(g.img) + '\')"' : '') + '>' + (g.meta ? g.meta : '') + '</div><div class="cp"><span class="nm">' + esc(g.name) + '</span><span class="vr">' + esc(g.ver) + '</span><span class="tg">' + esc(g.tag) + '</span></div>' + (g.id === S.last ? '<div class="last">last played</div>' : '');
      c.style.transform = 'translateX(' + k * 92 + '%) translateY(' + Math.abs(k) * 4 + '%) rotate(' + k * 5 + 'deg) scale(' + (k ? 0.86 : 1) + ')'; c.style.opacity = k ? 0.45 : 1; c.style.zIndex = 5 - Math.abs(k);
      d.appendChild(c);
    });
    $('dots').textContent = L.length ? (cur + 1) + ' / ' + L.length : '';
    var g = L[cur]; $('launch').textContent = g && g.meta ? (g.id === '_old' ? '\uD83D\uDDC2\uFE0F Open older versions' : '\u2B05\uFE0F Main games') : '\u25B6 Launch' + (g ? ' ' + g.name : '');
    var pl = S.playing && (S.list.filter(function (x) { return x.id === S.playing; })[0] || { name: S.playing });
    $('now').textContent = pl ? '\u25B6 ' + pl.name + (pl.ver ? ' ' + pl.ver : '') : 'on the launcher';
    $('backBtn').disabled = !S.playing; $('reload').disabled = !S.playing;
  }
  function step(n) { if (!S.list.length) return; cur = (cur + n + S.list.length) % S.list.length; draw(); send({ t: 'sel', i: cur }); if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {} }
  function send(m) { return net && net.send(m); }
  (function () { var x0 = null, y0 = 0, el = $('deck');
    el.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    el.addEventListener('touchend', function (e) { if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 35) step(dx < 0 ? 1 : -1); x0 = null; });
    el.addEventListener('click', function (e) { if (('ontouchstart' in window)) return; var r = el.getBoundingClientRect(); step(e.clientX > r.left + r.width / 2 ? 1 : -1); });
  })();
  $('launch').onclick = function () { var g = S.list[cur]; if (g) send({ t: 'launch', id: g.id }); };
  $('backBtn').onclick = function () { send({ t: 'back' }); };
  $('reload').onclick = function () { send({ t: 'reload' }); };
  function onMsg(m) {
    if (!m || m.t !== 'dev') return;
    var keep = S.list[cur] && S.list[cur].id, sameView = S.view === m.view; S = m;
    if (!sameView || !keep) cur = m.sel; else cur = Math.min(m.sel, m.list.length - 1);
    draw();
  }
  function start() {
    localStorage.setItem('dev7q3x-rroom', code); $('join').style.display = 'none';
    var useLocal = q.get('local') === '1';
    net = new (useLocal ? LRNet.LocalClient : LRNet.Client)({ code: code, onMessage: onMsg,
      onOpen: function () { net.send({ t: 'hello' }); },
      onStatus: function (s) { $('dot').classList.toggle('on', s === 'online'); $('stt').textContent = s === 'online' ? 'linked · ' + code : s === 'noroom' ? 'launcher not open (' + code + ')' : s + '…'; } });
    window.REMOTE = { net: net, state: function () { return { cur: cur, S: S }; }, step: step };
  }
  if (code) start(); else { $('join').style.display = 'flex'; $('go').onclick = function () { code = $('code').value.trim().toUpperCase(); if (code.length === 4) start(); }; }
})();
</script>
</body></html>
