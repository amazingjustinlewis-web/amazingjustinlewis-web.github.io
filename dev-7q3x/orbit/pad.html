<title>Orbit Brawl</title><link rel="stylesheet" href="../minikit/kit.css">
<style>body{background:#05040d}#hud{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}

<div id="over"></div><div id="rp"></div><button class="btn" id="skip">Skip &#9654;</button><div id="hostq"><div id="hq"></div><p style="margin:6px 0 0;font-size:13px">Friends scan to join this match.<br>Tap to hide.</p></div><div class="st" id="st"></div>
