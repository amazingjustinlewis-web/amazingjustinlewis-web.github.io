<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex, nofollow">
<title>Stack Attack pad</title><link rel="stylesheet" href="../minikit/kit.css"><link rel="stylesheet" href="stack.css">
<style>#go{left:12px;bottom:14px;transform:none}</style></head><body>
<canvas id="cv" class="full"></canvas><div class="hud"><div id="ph">Connecting&hellip;</div><div id="tm"></div></div><div id="tray"></div><button class="btn" id="rot">&#10227; Rotate</button><button class="btn go" id="go">Next round &#9654;</button><div class="st" id="st"></div>
<script>window.MINI = 'stack';</script><script src="../minikit/peerjs.min.js"></script><script src="../minikit/kit.js"></script><script src="../minikit/net.js"></script><script src="draw.js"></script><script>window.StackKinds = [['rect', 240, 50, '#ff5a6e'], ['rect', 100, 100, '#3aa8ff'], ['rect', 50, 200, '#5fdc7a'], ['rect', 320, 34, '#ffc93f'], ['tri', 150, 120, '#c77dff'], ['rect', 160, 80, '#ff9f43']];</script><script src="input.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); }, cv = $('cv'), ctx = cv.getContext('2d'), dpr = 1, st = null, cam = new StackDraw.Cam(), P = null;
  var c = Kit.pad({ onMsg: function (m) { if (m.t === 's') st = m.s; }, onStatus: function (s) { $('st').textContent = s; } });
  Kit.joinCard('STACK ATTACK', c, '<p>Drag blocks in from the left onto your stand before the disaster hits. Drag empty space to look around. Second finger or Rotate turns the block you hold.</p>');
  StackInput(cv, $('tray'), cam, function () { return P; }, { spawn: function (k, x, y) { c.send({ t: 'spawn', k: k, x: x, y: y }); }, grab: function (x, y) { if (!st) return false; var hit = st.b.some(function (b) { var v = b[0], cx = 0, cy = 0; v.forEach(function (q) { cx += q[0] / v.length; cy += q[1] / v.length; }); return Math.hypot(cx - x, cy - y) < 80 && Math.abs(cx - 500) < 400; }); if (hit) c.send({ t: 'pd', x: x, y: y }); return hit; },
    move: function (x, y) { c.send({ t: 'pm', x: x, y: y }); }, drop: function () { c.send({ t: 'pu' }); }, rotate: function () { c.send({ t: 'rot' }); } });
  $('rot').onclick = function () { c.send({ t: 'rot' }); }; $('go').onclick = function () { c.send({ t: 'next' }); };
  function size() { dpr = devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; } addEventListener('resize', size); size();
  var last = 0; (function loop(t) { var dt = Math.min(.05, (t - last) / 1000 || 0); last = t; if (st) { cam.update(st, dt, innerWidth, innerHeight); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); P = StackDraw.draw(ctx, innerWidth, innerHeight, st, cam.c, t / 1000);
    $('ph').textContent = st.phase === 'build' ? 'BUILD!' : st.phase === 'score' ? st.h.toFixed(1) + ' m standing' : st.name; $('tm').textContent = st.phase === 'score' ? 'best ' + st.best.toFixed(1) + 'm' : st.t + 's'; $('go').style.display = st.phase === 'score' ? 'block' : 'none'; $('tray').style.display = st.phase === 'build' ? 'flex' : 'none'; } requestAnimationFrame(loop); })(0);
})();
</script></body></html>
