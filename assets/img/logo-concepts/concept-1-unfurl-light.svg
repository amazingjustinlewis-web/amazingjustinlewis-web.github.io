<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18.16 -36.69 96.22 79.67" role="img" aria-labelledby="t d">
  <title id="t">0 → φ (Zero to Phi logo concept)</title>
  <desc id="d">One unbroken golden thread: the 0 closes on itself, then the stroke peels smoothly off its base, rises along a golden spiral and loops up and over into the bowl of the phi, thickening and thinning like a pen line.</desc>
